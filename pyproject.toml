[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pla"
version = "0.1.0"
description = "Limiting accuracy of physics-informed neural network training in floating-point arithmetic: reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.2", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: tests of a single function or module",
    "integration: tests that train a small network end to end",
]

[tool.coverage.run]
source = ["pla"]
